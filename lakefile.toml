name = "clocrap"
version = "0.1.0"
defaultTargets = ["clocrap"]

# Compiled into the binary by `Clocrap/SwiftReader.lean`, so a change to it must rebuild that.
[[input_file]]
name = "swift-reader"
path = "Clocrap/SwiftReader.swift"
text = true

# The same, for `Clocrap/LeanRefs.lean`.
[[input_file]]
name = "lean-refs"
path = "scripts/lean-refs.lean"
text = true

[[lean_lib]]
name = "Clocrap"
needs = ["swift-reader", "lean-refs"]

[[lean_exe]]
name = "clocrap"
root = "Main"

[[lean_exe]]
name = "clocrap-test"
root = "Tests"
